<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071E4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MoovHeal" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MoovHeal — Test mobile</title>
  <link rel="icon" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #F4F8FF;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      font-size: 16px !important;
    }

    #root {
      width: 100vw;
      height: 100dvh;
    }

    @supports not (height: 100dvh) {
      #root {
        height: 100vh;
      }
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState } = React;
const C = {
  blue:"#1A56DB",blueDark:"#0D3A8F",blueDeep:"#071E4A",
  teal:"#00C896",tealDark:"#009E78",
  white:"#FFFFFF",offwhite:"#F4F8FF",card:"#FFFFFF",
  border:"#E2EAF4",muted:"#7A90B0",text:"#0F2044",
  danger:"#FF4757",warn:"#FFB830",
};
const grad=`linear-gradient(160deg,${C.blueDeep} 0%,#0D3A8F 55%,#1A56DB 100%)`;
const tealGrad=`linear-gradient(135deg,${C.teal} 0%,#00A5D2 100%)`;

const LogoIcon=({size=36})=>(
  <img
    src="logo.png"
    alt="MoovHeal"
    width={size}
    height={size}
    style={{
      display:"block",
      borderRadius:Math.max(10, size * 0.22),
      objectFit:"cover",
      boxShadow:size>=70 ? "0 14px 35px rgba(0,0,0,.25)" : "none"
    }}
  />
);
const Logo=({dark=false,size="sm"})=>{
  const s=size==="lg"?52:size==="md"?42:32,f=size==="lg"?24:size==="md"?19:16;
  return(<div style={{display:"flex",alignItems:"center",gap:8}}><LogoIcon size={s}/>
    <span style={{fontWeight:900,fontSize:f,letterSpacing:-.5}}>
      <span style={{color:dark?C.text:C.white}}>Moov</span><span style={{color:C.teal}}>Heal</span>
    </span></div>);
};

const Field=({label,placeholder,icon,value="",onChange,type="text"})=>{
  const filled=value&&value.length>0;
  return(
    <div style={{marginBottom:14}}>
      {label&&<div style={{fontSize:11,fontWeight:700,color:filled?C.blue:C.muted,marginBottom:5,letterSpacing:.5,textTransform:"uppercase",transition:"color .2s"}}>{label}</div>}
      <div style={{background:filled?C.white:C.offwhite,border:`1.5px solid ${filled?C.blue+"55":C.border}`,borderRadius:12,padding:"11px 14px",display:"flex",alignItems:"center",gap:8,transition:"all .2s"}}>
        {icon&&<span style={{fontSize:16,opacity:filled?1:.6}}>{icon}</span>}
        <input type={type} value={value} onChange={onChange} placeholder={placeholder}
          style={{border:"none",background:"transparent",outline:"none",flex:1,fontSize:13,color:C.text,fontFamily:"'Segoe UI',system-ui,sans-serif",minWidth:0}}/>
      </div>
    </div>
  );
};

const PwField=({label,placeholder,value="",onChange})=>{
  const[show,setShow]=useState(false);
  const filled=value&&value.length>0;
  return(
    <div style={{marginBottom:14}}>
      {label&&<div style={{fontSize:11,fontWeight:700,color:filled?C.blue:C.muted,marginBottom:5,letterSpacing:.5,textTransform:"uppercase"}}>{label}</div>}
      <div style={{background:filled?C.white:C.offwhite,border:`1.5px solid ${filled?C.blue+"55":C.border}`,borderRadius:12,padding:"11px 14px",display:"flex",alignItems:"center",gap:8,transition:"all .2s"}}>
        <span style={{fontSize:16,opacity:filled?1:.6}}>🔒</span>
        <input type={show?"text":"password"} value={value} onChange={onChange} placeholder={placeholder}
          style={{border:"none",background:"transparent",outline:"none",flex:1,fontSize:13,color:C.text,fontFamily:"'Segoe UI',system-ui,sans-serif",minWidth:0}}/>
        <span onClick={()=>setShow(s=>!s)} style={{fontSize:14,cursor:"pointer",color:C.muted,userSelect:"none"}}>{show?"🙈":"👁"}</span>
      </div>
    </div>
  );
};

const SelField=({label,icon,value,onChange,options})=>(
  <div style={{marginBottom:10}}>
    {label&&<div style={{fontSize:11,fontWeight:700,color:C.blue,marginBottom:5,letterSpacing:.5,textTransform:"uppercase"}}>{label}</div>}
    <div style={{position:"relative"}}>
      {icon&&<span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:16,pointerEvents:"none",zIndex:1}}>{icon}</span>}
      <select value={value} onChange={onChange} style={{width:"100%",padding:`11px 36px 11px ${icon?"42px":"14px"}`,background:C.white,border:`1.5px solid ${C.blue}55`,borderRadius:12,fontSize:13,color:C.text,fontWeight:600,appearance:"none",cursor:"pointer",fontFamily:"'Segoe UI',system-ui,sans-serif",outline:"none"}}>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
      <span style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",fontSize:11,color:C.muted,pointerEvents:"none"}}>▾</span>
    </div>
  </div>
);

const Btn=({label,variant="primary",small,icon,onClick})=>{
  const s={
    primary:{bg:tealGrad,color:C.blueDeep,border:"none",shadow:"0 4px 18px rgba(0,200,150,.35)"},
    outline:{bg:"transparent",color:C.teal,border:`1.5px solid ${C.teal}`,shadow:"none"},
    ghost:{bg:"rgba(255,255,255,.08)",color:C.white,border:"1.5px solid rgba(255,255,255,.15)",shadow:"none"},
    danger:{bg:"#FFF0F0",color:C.danger,border:"1.5px solid #FFD0D0",shadow:"none"},
    blue:{bg:`linear-gradient(135deg,${C.blue},#1E88E5)`,color:C.white,border:"none",shadow:"0 4px 18px rgba(26,86,219,.35)"},
  }[variant];
  return(
    <div onClick={onClick} style={{background:s.bg,border:s.border,borderRadius:14,padding:small?"9px 16px":"13px 20px",textAlign:"center",color:s.color,fontWeight:700,fontSize:small?12:14,boxShadow:s.shadow,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,userSelect:"none"}}>
      {icon&&<span>{icon}</span>}{label}
    </div>
  );
};

const NavBar=({title,dark=true,onBack})=>(
  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 18px 8px",background:dark?"transparent":C.white,borderBottom:dark?"none":`1px solid ${C.border}`}}>
    <Logo dark={!dark}/>
    {title&&<span style={{fontWeight:700,fontSize:14,color:dark?C.white:C.text}}>{title}</span>}
    {onBack?<div onClick={onBack} style={{fontSize:18,color:dark?C.white:C.text,cursor:"pointer",padding:"4px 8px"}}>←</div>:<div style={{width:28}}/>}
  </div>
);

const Tag=({label,active,onClick})=>(
  <div onClick={onClick} style={{padding:"6px 12px",borderRadius:20,fontSize:11,fontWeight:700,background:active?tealGrad:C.offwhite,color:active?C.blueDeep:C.muted,border:`1.5px solid ${active?"transparent":C.border}`,cursor:"pointer",whiteSpace:"nowrap",userSelect:"none"}}>{label}</div>
);

const Card=({children,style={},onClick})=>(
  <div onClick={onClick} style={{background:C.card,borderRadius:18,border:`1px solid ${C.border}`,boxShadow:"0 2px 16px rgba(15,32,68,.06)",padding:16,cursor:onClick?"pointer":"default",...style}}>{children}</div>
);

const PBar=({pct,color=C.teal})=>(
  <div style={{background:C.border,borderRadius:99,height:6,overflow:"hidden"}}>
    <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:99}}/>
  </div>
);

const BotNav=({active,nav})=>{
  const items=[{icon:"🏠",label:"Accueil",s:4},{icon:"💪",label:"Parcours",s:5},{icon:"⚽",label:"Sport",s:9},{icon:"⚙️",label:"Réglages",s:10}];
  return(
    <div style={{display:"flex",borderTop:`1px solid ${C.border}`,background:C.white,padding:"8px 0 4px",flexShrink:0}}>
      {items.map(it=>(
        <div key={it.label} onClick={()=>nav(it.s)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer"}}>
          <span style={{fontSize:18}}>{it.icon}</span>
          <span style={{fontSize:9,fontWeight:700,color:it.label===active?C.teal:C.muted,letterSpacing:.3}}>{it.label.toUpperCase()}</span>
          {it.label===active&&<div style={{width:4,height:4,borderRadius:99,background:C.teal}}/>}
        </div>
      ))}
    </div>
  );
};

/* ═══════════════════════════════════════════════════════════ SCREENS ══════ */

// 0 ─ Bienvenue
const S0=({nav})=>(
  <div style={{height:"100%",background:grad,display:"flex",flexDirection:"column",alignItems:"center",padding:"50px 24px 32px"}}>
    <div style={{textAlign:"center",marginBottom:44}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><LogoIcon size={90}/></div>
      <div style={{fontWeight:900,fontSize:32,letterSpacing:-1}}>
        <span style={{color:C.white}}>Moov</span><span style={{color:C.teal}}>Heal</span>
      </div>
      <div style={{color:"rgba(255,255,255,.45)",fontSize:10,letterSpacing:4,marginTop:6}}>SPORT · REHABILITATION</div>
    </div>
    <div style={{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
      <Btn label="S'inscrire" variant="primary" onClick={()=>nav(1)}/>
      <div style={{height:1,background:"rgba(255,255,255,.1)",margin:"4px 0"}}/>
      <Btn label="🍎  Continuer avec Apple"  variant="ghost"   onClick={()=>nav(4)}/>
      <Btn label="🔵  Continuer avec Google" variant="ghost"   onClick={()=>nav(4)}/>
      <Btn label="Se connecter par email"    variant="outline" onClick={()=>nav(4)}/>
    </div>
    <div style={{marginTop:"auto",color:"rgba(255,255,255,.3)",fontSize:10}}>En continuant, vous acceptez nos CGU</div>
  </div>
);

// 1 ─ Profil
const S1=({nav,form,setForm})=>{
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));
  const ok=form.genre&&form.nom.trim()&&form.prenom.trim();
  return(
  <div style={{height:"100%",background:grad,display:"flex",flexDirection:"column"}}>
    <NavBar onBack={()=>nav(0)}/>
    <div style={{flex:1,background:C.offwhite,borderTopLeftRadius:28,borderTopRightRadius:28,padding:"24px 20px",overflowY:"auto"}}>
      <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:4}}>ÉTAPE 1/3</div>
      <PBar pct={33}/>
      <h2 style={{fontSize:20,fontWeight:800,color:C.text,margin:"16px 0 20px",letterSpacing:-.5}}>Créer mon profil</h2>
      <div style={{fontSize:11,fontWeight:700,color:C.muted,marginBottom:10,letterSpacing:.5,textTransform:"uppercase"}}>Genre</div>
      <div style={{display:"flex",gap:10,marginBottom:18}}>
        {[{icon:"♂️",label:"Homme",val:"homme"},{icon:"♀️",label:"Femme",val:"femme"}].map(g=>(
          <div key={g.val} onClick={()=>upd("genre",g.val)} style={{flex:1,background:form.genre===g.val?`linear-gradient(135deg,${C.blue},#1E88E5)`:C.white,border:`1.5px solid ${form.genre===g.val?"transparent":C.border}`,borderRadius:14,padding:"14px 8px",textAlign:"center",cursor:"pointer",boxShadow:form.genre===g.val?"0 4px 16px rgba(26,86,219,.3)":"none",transition:"all .2s",userSelect:"none"}}>
            <div style={{fontSize:24,marginBottom:4}}>{g.icon}</div>
            <div style={{fontWeight:700,fontSize:13,color:form.genre===g.val?C.white:C.muted}}>{g.label}</div>
          </div>
        ))}
      </div>
      <Field label="Nom" placeholder="Votre nom de famille" icon="👤" value={form.nom} onChange={e=>upd("nom",e.target.value)}/>
      <Field label="Prénom" placeholder="Votre prénom" icon="✏️" value={form.prenom} onChange={e=>upd("prenom",e.target.value)}/>
      {!ok&&<div style={{fontSize:11,color:C.muted,marginBottom:8,textAlign:"center"}}>Remplissez tous les champs pour continuer</div>}
      <div style={{marginTop:4,opacity:ok?1:.5,transition:"opacity .2s"}}>
        <Btn label="Suivant →" variant="blue" onClick={()=>ok&&nav(2)}/>
      </div>
    </div>
  </div>
);};


// 2 ─ Contact
const S2=({nav,form,setForm})=>{
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));
  const ok=form.email.includes("@")&&form.tel.trim()&&form.password.length>=6;
  return(
  <div style={{height:"100%",background:grad,display:"flex",flexDirection:"column"}}>
    <NavBar onBack={()=>nav(1)}/>
    <div style={{flex:1,background:C.offwhite,borderTopLeftRadius:28,borderTopRightRadius:28,padding:"24px 20px",overflowY:"auto"}}>
      <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:4}}>ÉTAPE 2/3</div>
      <PBar pct={66}/>
      <h2 style={{fontSize:20,fontWeight:800,color:C.text,margin:"16px 0 20px",letterSpacing:-.5}}>Mes coordonnées</h2>
      <Field label="Email" placeholder="votre@email.com" icon="✉️" type="email" value={form.email} onChange={e=>upd("email",e.target.value)}/>
      <Field label="Téléphone" placeholder="+33 6 00 00 00 00" icon="📱" type="tel" value={form.tel} onChange={e=>upd("tel",e.target.value)}/>
      <Field label="Ville" placeholder="Paris, Lyon…" icon="📍" value={form.adresse} onChange={e=>upd("adresse",e.target.value)}/>
      <PwField label="Mot de passe" placeholder="6 caractères minimum" value={form.password} onChange={e=>upd("password",e.target.value)}/>
      {form.password.length>0&&form.password.length<6&&(
        <div style={{fontSize:11,color:C.danger,marginTop:-8,marginBottom:10}}>⚠ Minimum 6 caractères</div>
      )}
      {!ok&&<div style={{fontSize:11,color:C.muted,marginBottom:8,textAlign:"center"}}>Remplissez tous les champs pour continuer</div>}
      <div style={{marginTop:4,opacity:ok?1:.5,transition:"opacity .2s"}}>
        <Btn label="Suivant →" variant="blue" onClick={()=>ok&&nav(3)}/>
      </div>
    </div>
  </div>
);};


// 3 ─ Blessure & Sport
const S3=({nav,form,setForm})=>{
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));
  const gravites=["Légère","Modérée","Sévère"];
  const zones=["Ligament","Tendon","Ménisque","Cartilage","Muscle","Os"];
  const blessures=["Genou","Épaule","Cheville","Dos","Hanche","Coude","Poignet","Mollet"];
  const sports=["Football","Basketball","Tennis","Natation","Cyclisme","Running","Musculation","Rugby","Handball","Volleyball"];
  const niveaux=["Amateur","Semi-pro","Pro"];
  return(
  <div style={{height:"100%",background:grad,display:"flex",flexDirection:"column"}}>
    <NavBar onBack={()=>nav(2)}/>
    <div style={{flex:1,background:C.offwhite,borderTopLeftRadius:28,borderTopRightRadius:28,padding:"20px 18px",overflowY:"auto"}}>
      <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:4}}>ÉTAPE 3/3</div>
      <PBar pct={100} color={C.teal}/>
      <h2 style={{fontSize:18,fontWeight:800,color:C.text,margin:"14px 0 16px",letterSpacing:-.5}}>Blessure & Sport</h2>

      {/* ── Blessure ── */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:800,color:C.blue,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>🩹 Ma blessure</div>
        <SelField icon="🦵" value={form.blessure} onChange={e=>upd("blessure",e.target.value)} options={blessures}/>
        <div style={{fontSize:11,color:C.muted,marginBottom:7,fontWeight:600,marginTop:6}}>Gravité</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
          {gravites.map((l,i)=><Tag key={l} label={l} active={form.gravite===i} onClick={()=>upd("gravite",i)}/>)}
        </div>
        <div style={{marginTop:10,fontSize:11,color:C.muted,marginBottom:7,fontWeight:600}}>Zone touchée</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
          {zones.map((l,i)=><Tag key={l} label={l} active={form.zone===i} onClick={()=>upd("zone",i)}/>)}
        </div>
      </div>

      {/* ── Sport ── */}
      <div>
        <div style={{fontSize:11,fontWeight:800,color:C.blue,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>⚽ Mon sport</div>
        <SelField icon="🏅" value={form.sport} onChange={e=>upd("sport",e.target.value)} options={sports}/>
        <div style={{fontSize:11,color:C.muted,marginBottom:7,fontWeight:600,marginTop:6}}>Niveau de pratique</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
          {niveaux.map((l,i)=><Tag key={l} label={l} active={form.niveau===i} onClick={()=>upd("niveau",i)}/>)}
        </div>
      </div>

      <div style={{marginTop:18}}>
        <Btn label="Créer mon programme 🎯" variant="primary" onClick={()=>nav(4)}/>
      </div>
    </div>
  </div>
);};


// 4 ─ Home
const S4=({nav,form})=>{
  const zones=["Ligament","Tendon","Ménisque","Cartilage","Muscle","Os"];
  const gravites=["Légère","Modérée","Sévère"];
  const prenom=form.prenom||"Sportif";
  const blessure=form.blessure||"Genou";
  const sport=form.sport||"Football";
  const gravite=gravites[form.gravite]||"Modérée";
  return(
  <div style={{height:"100%",background:C.offwhite,display:"flex",flexDirection:"column"}}>
    <div style={{background:grad,padding:"14px 18px 28px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <Logo/>
        <div style={{width:34,height:34,borderRadius:99,background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,cursor:"pointer"}}>🔔</div>
      </div>
      <div style={{marginTop:16,color:"rgba(255,255,255,.6)",fontSize:12}}>Bonjour, {prenom} 👋</div>
      <div style={{color:C.white,fontWeight:800,fontSize:18,letterSpacing:-.5,marginTop:2}}>Jour 14 de récupération</div>
      <PBar pct={46}/>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
        <span style={{color:"rgba(255,255,255,.5)",fontSize:10}}>{blessure} · {gravite}</span>
        <span style={{color:C.teal,fontSize:10,fontWeight:700}}>46% ✓</span>
      </div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 8px",display:"flex",flexDirection:"column",gap:12}}>
      {/* Programme */}
      <div onClick={()=>nav(5)} style={{background:`linear-gradient(135deg,${C.blue} 0%,#1E88E5 100%)`,borderRadius:20,padding:16,color:C.white,boxShadow:"0 8px 24px rgba(26,86,219,.3)",cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:10,opacity:.7,fontWeight:700,letterSpacing:1,marginBottom:4}}>PROGRAMME DU JOUR</div>
            <div style={{fontWeight:800,fontSize:16}}>Rééducation {blessure}</div>
            <div style={{opacity:.7,fontSize:12,marginTop:2}}>4 exercices · ~25 min</div>
          </div>
          <div style={{background:C.teal,borderRadius:12,padding:"8px 12px",color:C.blueDeep,fontWeight:800,fontSize:12}}>J.14</div>
        </div>
        <div style={{background:"rgba(255,255,255,.12)",borderRadius:14,height:70,marginTop:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36}}>🦵</div>
        <div style={{marginTop:12}}>
          <Btn label="Commencer le programme →" variant="primary" small onClick={()=>nav(5)}/>
        </div>
      </div>
      {/* Évolution */}
      <Card onClick={()=>nav(6)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontWeight:800,fontSize:14,color:C.text}}>📈 Mon évolution</span>
          <span style={{fontSize:10,color:C.teal,fontWeight:700}}>Voir tout →</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          {[["Douleur","↓ 40%",C.teal],["Mobilité","↑ 65%",C.blue],["Exos","18/30",C.warn]].map(([k,v,col])=>(
            <div key={k} style={{flex:1,background:C.offwhite,borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontWeight:800,fontSize:14,color:col}}>{v}</div>
              <div style={{fontSize:10,color:C.muted,fontWeight:600,marginTop:2}}>{k}</div>
            </div>
          ))}
        </div>
      </Card>
      {/* Blessure */}
      <Card onClick={()=>nav(7)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:C.text}}>🩹 Ma blessure</div>
            <div style={{fontSize:12,color:C.muted,marginTop:3}}>{blessure} · {zones[form.zone]||"Ligament"}</div>
            <div style={{display:"flex",gap:6,marginTop:7}}>
              <span style={{background:"#FFF3E0",color:C.warn,fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:99}}>{gravite}</span>
              <span style={{background:"#E3F2FD",color:C.blue,fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:99}}>{sport}</span>
            </div>
          </div>
          <div style={{fontSize:36}}>🦵</div>
        </div>
      </Card>
      {/* Tamagotchi */}
